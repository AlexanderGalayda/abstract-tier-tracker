name: Update network growth

on:
  schedule:
    # Weekly — on-chain cumulative wallet count barely moves day to day, and
    # unlike the tier snapshot this costs real Dune credits per run, so it
    # doesn't share the hourly cron in update-snapshot.yml.
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-network-growth
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh data/network-growth.json from Dune
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: node scripts/update-network-growth.mjs

      - name: Commit and push if data/network-growth.json changed
        run: |
          if git diff --quiet -- data/network-growth.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/network-growth.json
          git commit -m "chore: update network growth data"
          git push
